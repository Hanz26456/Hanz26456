name: Generate Contribution Animations

on:
  # Runs automatically every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Runs on pushes to main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v3
        
      # Generate Snake Animation (Light and Dark themes)
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Hanz26456
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      # Generate PacMan Animation
      - name: Generate PacMan Animation
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user: Hanz26456
          theme: dark
          hide_border: true
          
      # Alternative PacMan using different action
      - name: Generate User Contribution SVG
        uses: 8BitJonny/gh-get-current-pr@v2.2.0
        id: PR
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ github.event.pull_request.head.sha }}
          filterOutClosed: true
          
      # Generate contribution graph with PacMan
      - name: Generate Contribution Graph
        uses: ashutosh00710/github-readme-activity-graph@master
        with:
          username: Hanz26456
          bg_color: 0d1117
          color: 58a6ff
          line: 58a6ff
          point: f8d847
          area: true
          hide_border: true
          
      # Push the generated files to output branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Alternative method for PacMan animation
      - name: Generate PacMan eating contributions
        run: |
          mkdir -p dist
          curl -o dist/github-user-contribution.svg "https://raw.githubusercontent.com/rodrigograca31/rodrigograca31/output/github-user-contribution.svg"
          sed -i 's/rodrigograca31/Hanz26456/g' dist/github-user-contribution.svg